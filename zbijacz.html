      font-family: monospace;
      background: #1e1e1e;

      padding: 10px;

    input[type="number"],

      color: #f0f0f0;
      border: 1px solid #34a853;

    /* Dodatkowe style dla suwaka i jego wartości */
    #delaySettings {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 15px;
        padding: 10px;
        border: 1px dashed #34a853;
        border-radius: 5px;
    }
    .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 400px;
        margin-top: 5px;
    }
    input[type="range"] {
        flex-grow: 1;
        margin: 0 10px;
    }
    #sliderValue {
        min-width: 80px;
        text-align: right;
        font-weight: bold;
        color: #f9d71c;
    }

    /* Kontener przycisków */
    #buttonsContainer {
      margin-top: 10px;
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
      justify-content: center;

    /* Wszystkie przyciski mają taką samą szerokość */

      background-color: #34a853;

      cursor: pointer;
      display: flex;
      justify-content: center;

    }

      color: #fff;
      flex: 1 0 auto;
      min-width: 100px;
      max-width: 120px;
    }

      background-color: #f44336;
    }

    #status,
    #progress {
      margin-top: 20px;
      font-size: 18px;
      color: #ccc;
      text-align: center;
      user-select: none;
    }

      color: #f9d71c;
      font-weight: bold;
      font-style: normal;
    }

      margin-top: 15px;
      padding-left: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }
    .link-item {

      font-size: 16px;
    }

<body>
  <h2>Zautomatyzowana zbijarka EX'pa v0.33</h2>
  <p>Wklej każdy link w osobnej linii lub upuść plik TXT z linkami:</p>
  <textarea
    id="linkInput"
    placeholder="https://example.com&#10;https://kolejny-link.pl"
  ></textarea>
  <br />
  <label for="startFrom">Zacznij od linku nr:</label>
  <input type="number" id="startFrom" value="1" min="1" />

  <label for="baseInterval">Bazowy Interwał:</label>
  <select id="baseInterval">
      </select>
  <br />
    
    <div id="delaySettings">
        <label for="randomDelaySlider">Maksymalne Losowe Opóźnienie (ms):</label>
        <div class="setting-row">
            <span>0 ms</span>
            <input 
                type="range" 
                id="randomDelaySlider" 
                min="0" 
                max="60000" 
                step="1000" 
                value="6000" 
                oninput="updateSliderValue()"
            >
            <span id="sliderValue">6000 ms</span>
        </div>
        <small>(Opóźnienie jest losowo dodawane do interwału: 0ms do maks. ustawionej wartości)</small>
    </div>

  <div id="buttonsContainer">
    <button onclick="startOpening()">▶️ Start</button>
    <button onclick="pauseOpening()">⏸️ Stop</button>
    <button onclick="resumeOpening()">🔄 Wznów</button>
    <button onclick="shuffleLinks()">🔀 Wymieszaj</button>
    <button onclick="skipLink()">⏭️ Pomiń link</button>
    <button id="resetButton" onclick="resetPage()">❌ RESET</button>
  </div>

  <div id="status">Status: Oczekuję na start</div>
  <div id="progress"></div>
  <ul id="linkList"></ul>

  <script>
    let links = [];
    let currentIndex = 0;
    let paused = false;
    let nextClickTime = null;
    let timer;
    let skippedIndexes = new Set();
    
    // --- NOWA FUNKCJA - Generowanie opcji interwału ---
    function populateIntervalOptions() {
        const select = document.getElementById('baseInterval');
        for (let i = 5; i <= 15; i++) {
            const option = document.createElement('option');
            // Wartość w milisekundach
            option.value = i * 60 * 1000; 
            option.textContent = i + " minut";
            // Ustawienie 10 minut jako domyślne (jeśli było w oryginalnym skrypcie)
            if (i === 10) {
                option.selected = true;
            }
            select.appendChild(option);
        }
    }

    // --- NOWA FUNKCJA - Aktualizacja wartości suwaka ---
    function updateSliderValue() {
        const slider = document.getElementById('randomDelaySlider');
        const valueDisplay = document.getElementById('sliderValue');
        valueDisplay.textContent = slider.value + " ms";
    }

    function updateProgress() {
        const baseIntervalMs = parseInt(document.getElementById("baseInterval").value);
        const maxRandomDelayMs = parseInt(document.getElementById("randomDelaySlider").value);

        const percent = ((currentIndex / links.length) * 100).toFixed(1);
        const pdPoints = currentIndex * 3;
        const remaining = links.length - currentIndex;

        // Średni czas oczekiwania (ms) = Bazowy czas + (Max. Losowe Opóźnienie / 2)
        const avgDelayMs = baseIntervalMs + (maxRandomDelayMs / 2);
        
        // Szacowany czas do końca w minutach
        const etaMinutes = Math.ceil((remaining * avgDelayMs) / 60000);

        document.getElementById("progress").innerHTML = `
          Kliknięto ${currentIndex} / ${links.length} linków (${percent}%) — 
          <strong>Zbite Punkty Doświadczenia: ${pdPoints}</strong><br>
          <em>Szacowany czas do końca: ${etaMinutes} minut</em>
        `;
    }

    function updateLinkList() {
      const list = document.getElementById("linkList");
      list.innerHTML = "";
      links.forEach((link, index) => {
        const li = document.createElement("li");
        li.className = "link-item";
        li.textContent = `${index + 1}. ${link}`;
        // Kolor i ikona wg statusu linku:
        if (index < currentIndex) {
          if (skippedIndexes.has(index)) {
            li.style.color = "#f9d71c";
            li.prepend(document.createTextNode("🔄 "));
          } else {
            li.style.color = "#888";
            li.prepend(document.createTextNode("✅ "));
          }
        } else if (index === currentIndex) {
          li.style.color = "#34a853";
          li.prepend(document.createTextNode("🔴 "));
        } else {
          li.style.color = "#f0f0f0";
          li.prepend(document.createTextNode("🕓 "));
        }
        list.appendChild(li);
      });
    }

    function formatTime(ms) {
      const totalSec = ms / 1000;
      const min = Math.floor(totalSec / 60);
      const sec = Math.floor(totalSec % 60).toString().padStart(2, "0");
      const decimal = Math.floor((totalSec % 1) * 100).toString().padStart(2, "0");
      return `(${min}:${sec}.${decimal})`;
    }

    function updateTitleCountdown() {
      if (!nextClickTime || paused || currentIndex >= links.length) return;
      const now = Date.now();
      const remaining = nextClickTime - now;
      document.title = remaining > 0
        ? `${formatTime(remaining)} Auto Link Opener`
        : `Auto Link Opener`;
    }

    setInterval(updateTitleCountdown, 100);

    function openNextLink() {
      if (paused || currentIndex >= links.length) {
        if (currentIndex >= links.length) {
          document.getElementById("status").innerText =
            "Wszystkie linki zostały kliknięte.";
          document.title = "Auto Link Opener - zakończono";
        }
        return;
      }
        
        // --- NOWA LOGIKA OBLICZANIA OPÓŹNIENIA ---
        const baseIntervalMs = parseInt(document.getElementById("baseInterval").value);
        const maxRandomDelayMs = parseInt(document.getElementById("randomDelaySlider").value);

        // Losowy czas z zakresu [0, maxRandomDelayMs]
        const randomExtraDelay = Math.floor(Math.random() * (maxRandomDelayMs + 1)); 
        // Całkowite opóźnienie = Czas Bazowy + Losowe Opóźnienie
        const delay = baseIntervalMs + randomExtraDelay;
        // --- KONIEC NOWEJ LOGIKI ---

      const link = links[currentIndex];
      const a = document.createElement("a");
      a.href = link;
      a.target = "_blank";
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();

      document.getElementById("status").innerText =
        `Kliknięto link #${currentIndex + 1}: ${link}`;
      currentIndex++;
      updateProgress();
      updateLinkList();

      nextClickTime = Date.now() + delay;
      timer = setTimeout(openNextLink, delay);
    }

    function startOpening() {
      clearTimeout(timer);
      paused = false;
      skippedIndexes.clear();
      const input = document.getElementById("linkInput").value.trim();
      links = input
        .split("\n")
        .map(link => link.trim())
        .filter(link => link.length > 0);
      const startFrom = parseInt(document.getElementById("startFrom").value) || 1;
      if (links.length === 0) {
        alert("Wklej co najmniej jeden link.");
        return;
      }
      currentIndex = Math.max(0, startFrom - 1);
      updateProgress();
      updateLinkList();
      openNextLink();
    }

    function pauseOpening() {
      paused = true;
      clearTimeout(timer);
      document.title = `[Wstrzymano] Auto Link Opener`;
      document.getElementById("status").innerText =
        `Wstrzymano na linku #${currentIndex + 1}`;
    }

    function resumeOpening() {
      if (!paused || currentIndex >= links.length) return;
      paused = false;
      document.getElementById("status").innerText =
        `Wznawiam od linku #${currentIndex + 1}`;
      openNextLink();
    }

    function resetPage() {
      location.reload();
    }

    function shuffleLinks() {
      const input = document.getElementById("linkInput").value.trim();
      const lines = input
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0);
      for (let i = lines.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [lines[i], lines[j]] = [lines[j], lines[i]];
      }
      document.getElementById("linkInput").value = lines.join("\n");
    }

    function skipLink() {
      if (paused || currentIndex >= links.length) return;
      clearTimeout(timer);
      skippedIndexes.add(currentIndex);
      document.getElementById("status").innerText =
        `Pominięto link #${currentIndex + 1}: ${links[currentIndex]}`;
      currentIndex++;
      updateProgress();
      updateLinkList();

      if (currentIndex < links.length) {
        openNextLink();
      } else {
        document.getElementById("status").innerText =
          "Wszystkie linki zostały kliknięte.";
        document.title = "Auto Link Opener - zakończono";
      }
    }

    const textarea = document.getElementById("linkInput");
    textarea.addEventListener("dragover", e => e.preventDefault());
    textarea.addEventListener("drop", e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.name.endsWith(".txt")) {
        const reader = new FileReader();
        reader.onload = () => {
          textarea.value = reader.result;
        };
        reader.readAsText(file);
      }
    });
